name: BananaGram Android checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      diagnostic_run:
        description: 'Read failure reports from an earlier run without rebuilding (optional)'
        type: string
        required: false
  workflow_call:

permissions:
  contents: read
  actions: read

concurrency:
  group: android-checks-${{ github.ref }}-${{ inputs.diagnostic_run || 'acceptance' }}
  cancel-in-progress: true

jobs:
  java:
    if: inputs.diagnostic_run == ''
    name: Android compilation and policy tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Check private credential loader
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Verify configured API credentials
        if: github.event_name != 'pull_request'
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: python3 scripts/build-android.py -- -Dorg.gradle.jvmargs=-Xmx3g -Dorg.gradle.workers.max=2 :TMessagesProj:verifyBananaReleaseCredentials
      - name: Compile and test Android application code
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: python3 scripts/build-android.py -- -Dorg.gradle.jvmargs=-Xmx3g -Dorg.gradle.workers.max=2 :TMessagesProj:compileDebugJavaWithJavac :TMessagesProj:testDebugUnitTest

  smoke:
    if: inputs.diagnostic_run == ''
    name: Android ${{ matrix.api }} APK and UI checks
    strategy:
      fail-fast: false
      matrix:
        api: [33, 34, 35, 36]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Enable emulator acceleration for this runner
        run: sudo setfacl -m "u:$(id -un):rw" /dev/kvm
      - name: Build development APK and instrumentation
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          CMAKE_BUILD_PARALLEL_LEVEL: '2'
        run: python3 scripts/build-android.py -- -Dorg.gradle.jvmargs=-Xmx3g -Dorg.gradle.workers.max=2 -Pandroid.injected.build.abi=x86_64 :TMessagesProj_AppStandalone:assembleAfatDebug :TMessagesProj_AppStandalone:assembleAfatDebugAndroidTest
      - name: Check a fresh emulator without signing in
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: python3 scripts/run-android-smoke.py --serial emulator-5554 --voice-probe
      - name: Save test logs and unsigned-client screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-smoke-diagnostics-api${{ matrix.api }}
          path: build/banana-smoke/
          if-no-files-found: ignore
          retention-days: 7

  diagnostics:
    if: github.event_name == 'workflow_dispatch' && inputs.diagnostic_run != ''
    name: Read previous Android failure reports
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download test reports and expose failure context in check annotations
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DIAGNOSTIC_RUN: ${{ inputs.diagnostic_run }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re, subprocess
          run = os.environ['DIAGNOSTIC_RUN']
          if not re.fullmatch(r'[0-9]+', run):
              raise SystemExit('Expected a numeric run ID from this repository')
          directory = pathlib.Path(os.environ['RUNNER_TEMP']) / 'android-diagnostics'
          subprocess.run(['gh', 'run', 'download', run, '--dir', str(directory)], check=True)
          found = 0
          for name in ('installation.log', 'instrumentation.log', 'offline-voice.log', 'logcat.log'):
              for file in sorted(directory.rglob(name)):
                  value = file.read_text(errors='replace')
                  if name == 'logcat.log':
                      lines = value.splitlines()
                      indices = [i for i, line in enumerate(lines) if 'FATAL EXCEPTION' in line or 'AssertionError' in line]
                      value = '\n'.join(lines[i] for i in sorted({n for i in indices for n in range(max(0, i-2), min(len(lines), i+28))}))
                  elif name == 'instrumentation.log':
                      summary = value.rsplit('INSTRUMENTATION_RESULT: stream=', 1)
                      if len(summary) == 2:
                          value = summary[1]
                      else:
                          value = '\n'.join(value.splitlines()[-35:])
                  else:
                      value = '\n'.join(value.splitlines()[-50:])
                  if not value:
                      continue
                  value = value[-3400:].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  label = str(file.relative_to(directory)).replace(',', '_')
                  print(f'::warning title={label}::{value}')
                  found += 1
          if not found:
              raise SystemExit('No Android test report files found in this run')
          PY
