name: Build BananaGram release APK

on:
  workflow_dispatch:
    inputs:
      verified_run:
        description: 'Successful full Android CI run for this exact commit (optional)'
        type: string
        required: false

permissions:
  contents: write
  actions: read

jobs:
  checks:
    if: inputs.verified_run == ''
    uses: ./.github/workflows/android.yml
    secrets: inherit
  verified_checks:
    if: inputs.verified_run != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate completed Android acceptance for the exact release commit
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_RUN: ${{ inputs.verified_run }}
        run: python3 scripts/verify_android_ci.py --run "$VERIFIED_RUN" --repository "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA"
  build:
    needs: [checks, verified_checks]
    if: always() && !cancelled() && (needs.checks.result == 'success' || needs.verified_checks.result == 'success')
    name: Signed BananaGram APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '2'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: ''

      - name: Install Android build tools
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'

      - name: Prepare private release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.BANANAGRAM_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/bananagram-release.p12"
          chmod 600 "$RUNNER_TEMP/bananagram-release.p12"

      - name: Build signed release APK
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          BANANAGRAM_RELEASE_KEYSTORE: ${{ runner.temp }}/bananagram-release.p12
          BANANAGRAM_RELEASE_STORE_PASSWORD: ${{ secrets.BANANAGRAM_RELEASE_STORE_PASSWORD }}
          BANANAGRAM_RELEASE_KEY_ALIAS: ${{ secrets.BANANAGRAM_RELEASE_KEY_ALIAS }}
          BANANAGRAM_RELEASE_KEY_PASSWORD: ${{ secrets.BANANAGRAM_RELEASE_KEY_PASSWORD }}
        run: python3 scripts/build-android.py -- -Dorg.gradle.jvmargs=-Xmx3g -Dorg.gradle.workers.max=2 :TMessagesProj_AppStandalone:assembleAfatStandalone

      - name: Verify APK identity and signature
        run: |
          apk="$(python3 -c 'from pathlib import Path; root=Path("TMessagesProj_AppStandalone/build"); files=list((root/"outputs/apk").rglob("app.apk")) or list((root/"intermediates/apk").rglob("app.apk")); assert len(files)==1, "Expected one release APK"; print(files[0])')"
          test -s "$apk"
          aapt="$ANDROID_HOME/build-tools/36.0.0/aapt"
          badging="$RUNNER_TEMP/bananagram-badging.txt"
          "$aapt" dump badging "$apk" | tee "$badging"
          grep -Fq "package: name='org.telegram.messenger.web'" "$badging"
          grep -Fq "application: label='BananaGram'" "$badging"
          grep -Fq 'android:icon="@mipmap/ic_launcher_sa"' TMessagesProj/config/release/AndroidManifest_standalone.xml
          icon="$(sed -n "s/^application:.* icon='\\([^']*\\)'.*/\\1/p" "$badging")"
          test -n "$icon"
          unzip -Z1 "$apk" | grep -Fxq "$icon"
          if grep -Fq 'application-debuggable' "$badging"; then
            echo 'Release APK must not be debuggable' >&2
            exit 1
          fi
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/bananagram-signature.txt"
          grep -Fxq "sdkVersion:'33'" "$badging"
          grep -Fxq 'Signer #1 certificate SHA-256 digest: ceed8fcb50535731aeab5d27cd75d02936b0a9e466c0285d0da0baa93d3e5634' "$RUNNER_TEMP/bananagram-signature.txt"
          python3 scripts/check-apk-native-pages.py "$apk"
          mkdir -p build/release-output
          version="$(sed -n 's/^APP_VERSION_NAME=//p' gradle.properties)"
          cp "$apk" "build/release-output/BananaGram-${version}-release.apk"
          cp "$RUNNER_TEMP/bananagram-signature.txt" build/release-output/signature.txt
          cp TMessagesProj_AppStandalone/build/outputs/mapping/afatStandalone/mapping.txt build/release-output/mapping.txt
          printf 'Version: %s\nCommit: %s\nPackage: org.telegram.messenger.web\n' "$version" "$GITHUB_SHA" > build/release-output/build-info.txt
          (cd build/release-output && sha256sum ./*.apk > SHA256SUMS)

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: BananaGram-release-${{ github.sha }}
          path: build/release-output/
          if-no-files-found: error
          retention-days: 30

      - name: Publish signed prerelease for in-app updates
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="$(sed -n 's/^APP_VERSION_NAME=//p' gradle.properties)"
          printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$'
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'This release already exists; refuse to replace published update assets' >&2
            exit 1
          fi
          gh release create "$tag" build/release-output/* \
            --target "$GITHUB_SHA" --title "BananaGram Android $version" \
            --prerelease --notes-file docs/prerelease-notes.md
