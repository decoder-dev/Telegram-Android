name: Build BananaGram release APK

on:
  workflow_dispatch:
    inputs:
      skip_checks:
        description: 'Build and publish without running automated acceptance tests'
        type: boolean
        required: false
        default: false
      verified_run:
        description: 'Successful full Android CI run for this exact commit (optional)'
        type: string
        required: false

permissions:
  contents: write
  actions: read

jobs:
  checks:
    if: ${{ !inputs.skip_checks && inputs.verified_run == '' }}
    uses: ./.github/workflows/android.yml
    secrets: inherit
  verified_checks:
    if: ${{ !inputs.skip_checks && inputs.verified_run != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate completed Android acceptance for the exact release commit
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_RUN: ${{ inputs.verified_run }}
        run: python3 scripts/verify_android_ci.py --run "$VERIFIED_RUN" --repository "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA"
  build:
    needs: [checks, verified_checks]
    if: always() && !cancelled() && (inputs.skip_checks || needs.checks.result == 'success' || needs.verified_checks.result == 'success')
    name: Signed BananaGram APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      BANANAGRAM_CCACHE: /usr/bin/ccache
      CCACHE_DIR: ${{ runner.temp }}/bananagram-ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_COMPRESS: 'true'
      CCACHE_MAXSIZE: 2G

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Restore native compiler cache
        id: native_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: banana-native-v1-${{ runner.os }}-ndk27-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: banana-native-v1-${{ runner.os }}-ndk27-

      - name: Restore Gradle task outputs
        id: gradle_tasks
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.gradle/caches/build-cache-1
          key: banana-gradle-tasks-v1-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: banana-gradle-tasks-v1-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}-

      - name: Prepare native compiler cache
        run: |
          if ! command -v ccache >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ccache
          fi
          mkdir -p "$CCACHE_DIR"
          ccache --zero-stats

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: ''

      - name: Install Android build tools
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'

      - name: Prepare private release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.BANANAGRAM_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/bananagram-release.p12"
          chmod 600 "$RUNNER_TEMP/bananagram-release.p12"

      - name: Build signed release APK
        id: build_signed
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          BANANAGRAM_RELEASE_KEYSTORE: ${{ runner.temp }}/bananagram-release.p12
          BANANAGRAM_RELEASE_STORE_PASSWORD: ${{ secrets.BANANAGRAM_RELEASE_STORE_PASSWORD }}
          BANANAGRAM_RELEASE_KEY_ALIAS: ${{ secrets.BANANAGRAM_RELEASE_KEY_ALIAS }}
          BANANAGRAM_RELEASE_KEY_PASSWORD: ${{ secrets.BANANAGRAM_RELEASE_KEY_PASSWORD }}
        run: python3 scripts/build-android.py -- --build-cache -Dorg.gradle.jvmargs=-Xmx3g -Dorg.gradle.workers.max=2 :TMessagesProj_AppStandalone:assembleAfatStandalone

      - name: Verify APK identity and signature
        env:
          SKIP_CHECKS: ${{ inputs.skip_checks }}
        run: |
          apk="$(python3 -c 'from pathlib import Path; root=Path("TMessagesProj_AppStandalone/build"); files=list((root/"outputs/apk").rglob("app.apk")) or list((root/"intermediates/apk").rglob("app.apk")); assert len(files)==1, "Expected one release APK"; print(files[0])')"
          test -s "$apk"
          # rc.1's in-app updater accepts APKs up to 300 MiB.
          test "$(stat -c %s "$apk")" -le 314572800
          version="$(sed -n 's/^APP_VERSION_NAME=//p' gradle.properties)"
          base_code="$(sed -n 's/^APP_VERSION_CODE=//p' gradle.properties)"
          aapt="$ANDROID_HOME/build-tools/36.0.0/aapt"
          badging="$RUNNER_TEMP/bananagram-badging.txt"
          "$aapt" dump badging "$apk" | tee "$badging"
          grep -Fq "package: name='org.telegram.messenger.web'" "$badging"
          grep -Fq "versionName='$version'" "$badging"
          grep -Fq "versionCode='$((base_code * 10 + 9))'" "$badging"
          grep -Fq "application: label='BananaGram'" "$badging"
          grep -Fq 'android:icon="@mipmap/ic_launcher_sa"' TMessagesProj/config/release/AndroidManifest_standalone.xml
          icon="$(sed -n "s/^application:.* icon='\\([^']*\\)'.*/\\1/p" "$badging")"
          test -n "$icon"
          python3 -c 'import sys, zipfile; assert sys.argv[2] in zipfile.ZipFile(sys.argv[1]).namelist(), "Missing launcher icon"' "$apk" "$icon"
          if grep -Fq 'application-debuggable' "$badging"; then
            echo 'Release APK must not be debuggable' >&2
            exit 1
          fi
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/bananagram-signature.txt"
          grep -Fxq "sdkVersion:'33'" "$badging"
          grep -Fxq "targetSdkVersion:'36'" "$badging"
          grep -Fxq 'Signer #1 certificate SHA-256 digest: ceed8fcb50535731aeab5d27cd75d02936b0a9e466c0285d0da0baa93d3e5634' "$RUNNER_TEMP/bananagram-signature.txt"
          python3 scripts/check-apk-native-pages.py "$apk"
          python3 scripts/check-theme-reflection.py TMessagesProj_AppStandalone/build/outputs/mapping/afatStandalone/mapping.txt --apk "$apk"
          mkdir -p build/release-output
          version="$(sed -n 's/^APP_VERSION_NAME=//p' gradle.properties)"
          cp "$apk" "build/release-output/BananaGram-${version}-release.apk"
          cp "$RUNNER_TEMP/bananagram-signature.txt" build/release-output/signature.txt
          cp TMessagesProj_AppStandalone/build/outputs/mapping/afatStandalone/mapping.txt build/release-output/mapping.txt
          printf 'Version: %s\nCommit: %s\nPackage: org.telegram.messenger.web\n' "$version" "$GITHUB_SHA" > build/release-output/build-info.txt
          printf 'Automated acceptance tests skipped: %s\n' "$SKIP_CHECKS" >> build/release-output/build-info.txt
          (cd build/release-output && sha256sum ./*.apk > SHA256SUMS)

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: BananaGram-release-${{ github.sha }}
          path: build/release-output/
          if-no-files-found: error
          retention-days: 30

      - name: Preserve the signed APK and mapping if packaging fails
        if: failure() && steps.build_signed.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: BananaGram-failed-release-${{ github.sha }}
          path: |
            TMessagesProj_AppStandalone/build/**/app.apk
            TMessagesProj_AppStandalone/build/outputs/mapping/afatStandalone/mapping.txt
            ${{ runner.temp }}/bananagram-signature.txt
            ${{ runner.temp }}/bananagram-badging.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Publish signed prerelease for in-app updates
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SKIP_CHECKS: ${{ inputs.skip_checks }}
        run: |
          version="$(sed -n 's/^APP_VERSION_NAME=//p' gradle.properties)"
          printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$'
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'This release already exists; refuse to replace published update assets' >&2
            exit 1
          fi
          notes="$RUNNER_TEMP/bananagram-release-notes.md"
          cp docs/prerelease-notes.md "$notes"
          if [ "$SKIP_CHECKS" = true ]; then
            printf '\n%s\n' 'Этот кандидат выпущен без нового прогона автоматических тестов. Подпись и параметры APK проверены при сборке.' >> "$notes"
          fi
          gh release create "$tag" build/release-output/* \
            --target "$GITHUB_SHA" --title "BananaGram Android $version" \
            --prerelease --notes-file "$notes"

      - name: Report native compiler cache statistics
        id: native_stats
        if: always() && steps.build_signed.outcome != 'skipped'
        run: |
          ccache --show-stats
          if [ -n "$(find "$CCACHE_DIR" -type f -name '*R' -print -quit)" ]; then
            printf 'has_cache=true\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Save native compiler cache even after a failed release
        if: always() && steps.native_stats.outputs.has_cache == 'true' && steps.native_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.native_cache.outputs.cache-primary-key }}

      - name: Save Gradle task outputs even after a failed release
        if: always() && steps.build_signed.outcome != 'skipped' && steps.gradle_tasks.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.gradle/caches/build-cache-1
          key: ${{ steps.gradle_tasks.outputs.cache-primary-key }}
